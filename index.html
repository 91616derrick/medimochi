    <div class="hero"><div class="txt"><div class="eyebrow">MEDMOCHI STUDY</div><h1>醫學糰子正在準備你的複習室 🍡</h1><p>高血壓、高血脂｜知識筆記與臨床情境題</p></div></div>
    <div class="wide-notice" id="boot-note">如果畫面一直停留在「正在準備」，代表互動程式沒有成功載入。請點選 <a href="diagnose.html">網站診斷頁</a>，並將結果截圖給我。你的學習紀錄不會因此被刪除。</div>
    <div class="courses"><article class="course-card peach"><div class="course-top"><span class="course-emoji">🫀</span></div><h3>高血壓</h3><div class="english">Hypertension</div><p>診斷、藥物機轉、次發性高血壓與高血壓急症</p></article><article class="course-card mint"><div class="course-top"><span class="course-emoji">🍓</span></div><h3>高血脂</h3><div class="english">Dyslipidemia</div><p>LDL-C、TG、ASCVD 風險與臨床治療</p></article></div>

<script>
(function(){
  function report(message){var el=document.getElementById('medmochi-error');if(el){el.style.display='block';el.textContent='醫學糰子載入時遇到問題：'+String(message||'未知錯誤')+'。請截圖此訊息，或開啟 diagnose.html。';}}
  window.addEventListener('error',function(e){if(!window.MEDMOCHI_APP_READY)report(e.message||'載入失敗');});
  window.addEventListener('unhandledrejection',function(e){if(!window.MEDMOCHI_APP_READY)report((e.reason&&e.reason.message)||'背景載入失敗');});
  window.addEventListener('load',function(){if(!window.MEDMOCHI_APP_READY)report('互動程式未能啟動');});
})();
</script>
